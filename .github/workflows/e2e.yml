# E2E — the REAL compiled app driven over WebDriver on a real Windows runner.
# Uses @wdio/tauri-service in "embedded" mode: the WebDriver server lives
# inside the app (tauri-plugin-wdio-webdriver, enabled via the `wdio` cargo
# feature) — no external tauri-driver or msedgedriver needed.
# Runs on PRs touching app code, nightly on main, or manually.
name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *" # 21:00 UTC = 03:00 Bangladesh Standard Time
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "e2e/**"
      - "package-lock.json"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webdriver-windows:
    name: WebDriver (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (root)
        run: npm ci

      - name: Install dependencies (e2e)
        run: npm ci
        working-directory: e2e

      # Debug build with the embedded-WebDriver feature; much faster than a
      # release build and gives readable failures. The feature adds ONLY the
      # test driver plugin — production release builds never enable it.
      - name: Build app (debug, wdio feature)
        run: npm run tauri build -- --debug --features wdio
        env:
          TAURI_ENV_DEBUG: "true"

      # Upload the built exe so Prince can ground-truth test it on real
      # hardware without any local Rust toolchain.
      - name: Upload debug exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-debug-build
          path: src-tauri/target/debug/asol-naki.exe
          if-no-files-found: error
          retention-days: 14

      - name: Run WebDriver suite
        run: npm test
        working-directory: e2e
        env:
          TAURI_APP_BINARY_PATH: ${{ github.workspace }}/src-tauri/target/debug/asol-naki.exe

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-evidence
          path: |
            e2e/logs/**
            e2e/*.log
            e2e/screenshots/**
          if-no-files-found: ignore
          retention-days: 7
