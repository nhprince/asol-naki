[package]
name = "asol-naki"
version = "0.1.0"
description = "Asol Naki? — laptop trust check for second-hand buyers"
authors = ["NH Prince <nhprince@users.noreply.github.com>"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "asol_naki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"

# Embedded WebDriver server — ONLY compiled into E2E test builds
# (`cargo build --features wdio`); release builds never include it.
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
wmi = "0.14"

[features]
wdio = ["dep:tauri-plugin-wdio-webdriver"]

[dev-dependencies]
